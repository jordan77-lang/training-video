<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Status - Training Video Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .content {
            padding: 40px;
        }
        
        .status-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .status-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }
        
        .status-row:last-child {
            border-bottom: none;
        }
        
        .status-label {
            font-weight: 600;
            color: #555;
        }
        
        .status-value {
            color: #333;
        }
        
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .status-healthy {
            background: #48bb78;
        }
        
        .status-error {
            background: #f56565;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 System Status</h1>
            <p>Training Video Generator</p>
        </div>
        
        <div class="content">
            <div id="loading" class="loading">
                <p>Checking system status...</p>
            </div>
            
            <div id="statusContent" style="display: none;">
                <div class="status-card" id="statusCard"></div>
                
                <div class="back-link">
                    <a href="/">← Back to Home</a>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        async function checkStatus() {
            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('statusContent').style.display = 'block';
                
                const statusCard = document.getElementById('statusCard');
                const isHealthy = data.status === 'healthy';
                
                statusCard.innerHTML = `
                    <div class="status-row">
                        <span class="status-label">Status</span>
                        <span class="status-value">
                            <span class="status-indicator ${isHealthy ? 'status-healthy' : 'status-error'}"></span>
                            ${data.status.toUpperCase()}
                        </span>
                    </div>
                    <div class="status-row">
                        <span class="status-label">Service</span>
                        <span class="status-value">${data.service}</span>
                    </div>
                    <div class="status-row">
                        <span class="status-label">Version</span>
                        <span class="status-value">${data.version}</span>
                    </div>
                    <div class="status-row">
                        <span class="status-label">Last Check</span>
                        <span class="status-value">${new Date(data.timestamp).toLocaleString()}</span>
                    </div>
                    <div class="status-row">
                        <span class="status-label">Supported Formats</span>
                        <span class="status-value">${(data.features?.documentParsing || []).join(', ').toUpperCase()}</span>
                    </div>
                    <div class="status-row">
                        <span class="status-label">Max Slides</span>
                        <span class="status-value">${data.features?.maxSlides || 'N/A'}</span>
                    </div>
                `;
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('statusContent').style.display = 'block';
                
                const statusCard = document.getElementById('statusCard');
                statusCard.innerHTML = `
                    <div class="status-row">
                        <span class="status-label">Status</span>
                        <span class="status-value">
                            <span class="status-indicator status-error"></span>
                            ERROR
                        </span>
                    </div>
                    <div class="status-row">
                        <span class="status-label">Message</span>
                        <span class="status-value">Unable to connect to service</span>
                    </div>
                `;
            }
        }
        
        // Check status on load
        checkStatus();
        
        // Refresh every 30 seconds only when page is visible
        let refreshInterval = setInterval(checkStatus, 30000);
        
        // Pause refresh when page is hidden
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                clearInterval(refreshInterval);
            } else {
                checkStatus();
                refreshInterval = setInterval(checkStatus, 30000);
            }
        });
    </script>
</body>
</html>
